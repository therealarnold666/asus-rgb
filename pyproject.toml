[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asus-rgb"
version = "0.2.0"
description = "Unified RGB control for local ASUS/ROG devices on Linux"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
readme = "README.md"

[project.scripts]
asus-rgb = "asus_rgb.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
